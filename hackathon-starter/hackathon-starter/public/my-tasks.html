<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Tasks — NovaWorks AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header id="navbar" class="navbar"></header>
<main class="container" style="padding-top:2rem;padding-bottom:3rem;">
  <div class="page-header">
    <h1>My Tasks</h1>
    <p class="text-muted" id="myTasksSubtitle">Your assigned tasks across all projects.</p>
  </div>
  <div class="stats-row" id="agentStats">
    <div class="stat-card">
      <span class="stat-value" id="agentTaskCount">0</span>
      <span class="stat-label">My Tasks</span>
    </div>
    <div class="stat-card">
      <span class="stat-value" id="agentHoursCount">0</span>
      <span class="stat-label">Total Hours</span>
    </div>
  </div>
  <div id="tasksLoading" class="empty-state">
    <div class="spinner" style="margin:0 auto;width:32px;height:32px;"></div>
    <p class="text-muted mt-2">Loading your tasks…</p>
  </div>
  <div id="tasksEmpty" class="empty-state" style="display:none;">
    <span class="empty-icon">✅</span>
    <h3>No tasks assigned yet</h3>
    <p>Your tasks will appear here once projects are created.</p>
  </div>
  <div id="tasksTableWrapper" class="table-wrapper" style="display:none;">
    <table>
      <thead>
        <tr>
          <th>Task</th>
          <th>Project</th>
          <th>Manager</th>
          <th>Deadline</th>
          <th style="text-align:right;">Hours</th>
        </tr>
      </thead>
      <tbody id="myTasksBody"></tbody>
    </table>
  </div>
</main>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/my-tasks.js"></script>
</body>
</html>
